<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de Login — Modo Clássico</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="vegeta.css" />
    <link rel="stylesheet" href="styles/particles.css" />
    <link
      rel="shortcut icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJU32uQwa0-Q_i3LmbsIf-CPQXghW1K2MQLg&usqp=CAU"
      type="image/x-icon"
    />
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" defer></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" defer></script>
    <script src="js/auth-service.js" defer></script>
    <script src="js/theme-engine.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="login-box col-md-6">
          <h2 class="text-center">Acesso ao Portal</h2>
          <form id="login-form">
            <div class="form-group text-left">
              <label for="username">Usuário</label>
              <input type="text" class="form-control" id="username" name="username" required autocomplete="username" />
            </div>
            <div class="form-group text-left">
              <label for="password">Senha</label>
              <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" />
            </div>
            <div class="form-group text-left">
              <label for="cpf">CPF</label>
              <input type="text" class="form-control" id="cpf" name="cpf" required placeholder="000.000.000-00" />
            </div>
            <div class="form-group text-left">
              <label for="email">E-mail</label>
              <input type="email" class="form-control" id="email" name="email" required autocomplete="email" />
            </div>
            <button type="submit" class="btn btn-primary btn-block py-2 font-weight-bold">Entrar</button>
          </form>
          <div class="mt-3 text-center">
            <a href="index.html" style="color: #A1A1AA; font-size: 0.85em;">Alternar para Novo Portal com Abas →</a>
          </div>
          <div id="message" class="mt-3"></div>
        </div>
      </div>
    </div>
  </body>
</html>
